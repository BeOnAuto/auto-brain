# yaml-language-server: $schema=./auto-brain.schema.json
#
# The settings of auto-brain that are lists or maps. Copy this file to
# auto-brain.yaml at the root of the repository, which git ignores, and pnpm dev
# passes it to the server. In a container, mount it and set CONFIG_FILE to its
# path inside the container.
#
# Each key stands for the environment variable of the same name in upper case,
# which wins over the key when both are set. Secrets never go in this file:
# write ${NAME} where one belongs and set NAME in .env or in the container.
# DATABASE_URL, the PostgreSQL database of the ledger, holds a password, so it
# is read from the environment only and has no key here.

# OpenAI-compatible gateways; a reasoning function then names gateway/<model id>.
model_gateways:
  - name: gateway
    base_url: https://gateway.example.com/v1
    api_key: ${GATEWAY_API_KEY}

# Send every anthropic/<model id> a reasoning function names through the gateway.
model_aliases:
  anthropic/*: gateway/anthropic/*

# The models list_models shows for a provider that does not list its own
# (bedrock, bedrock-anthropic, azure, vertex, vertex-anthropic), and for a
# gateway whose list of models cannot be read.
# declared_models:
#   bedrock:
#     - eu.anthropic.claude-sonnet-4-5-20250929-v1:0
#   gateway:
#     - anthropic/claude-haiku-4-5

# The only models a reasoning function may name and list_models shows; every
# model when left out. A trailing * stands for any model id.
# allowed_models:
#   - anthropic/*
#   - gateway/anthropic/claude-haiku-4-5

# The MCP servers whose tools a reasoning function may name in its tools key,
# each bound to an org and, optionally, to some of its brains. A remote server
# has a url; a process has a command, installed and pinned, which inherits
# nothing from the server's environment but its env.
# mcp_servers:
#   graph:
#     url: https://gateway.example.com/mcp
#     headers:
#       Authorization: Bearer ${GRAPH_API_KEY}
#     org: acme
#     brains: [sales]
#   notes:
#     command: /usr/local/bin/notes-mcp-server
#     args: [--read-only]
#     env:
#       NOTES_API_KEY: ${NOTES_API_KEY}
#     org: acme

# The only tools a reasoning function may name, each server/tool or server/*;
# every tool when left out.
# allowed_tools:
#   - graph/search
#   - notes/*

# The origins a page in a browser may call the API from.
allowed_origins:
  - http://localhost:5173

# The API keys the server accepts, each as pnpm key prints it. With any key
# set, local mode is off and every request needs a key.
# api_keys:
#   - id: ci
#     org: acme
#     permissions: [org:read, org:write, brain:read, brain:write]
#     brains: '*'
#     sha256: <the digest pnpm key prints>
