name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache the Temporal dev server the orchestration tests download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/temporal-sdk-typescript-*
          key: temporal-dev-server-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('primitives/orchestration/package.json') }}
      - name: Format, lint, type-check, test with 100% coverage, knip, sherif
        run: pnpm check
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

  container:
    name: Container (linux/${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/server/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          load: true
          tags: auto-brain:ci
      - name: Smoke test the image
        run: |
          docker run --detach --name smoke --publish 8080:8080 auto-brain:ci
          for attempt in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:8080/health && break
            sleep 1
          done
          test "$(curl --silent --fail http://127.0.0.1:8080/health)" = '{"status":"ok"}'
          test "$(docker exec smoke id -un)" = node
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/v1/orgs/demo/brains)" = 401
          test "$(curl --silent --include http://127.0.0.1:8080/v1/orgs/demo/brains | grep --ignore-case --count '^www-authenticate: Bearer')" = 1
          test "$(docker run --rm auto-brain:ci node packages/identity/src/key-command.ts --org demo | grep --count --extended-regexp '^API key, shown only this once: abk_[0-9a-f]{8}_[A-Za-z0-9_-]{43}$')" = 1
          docker stop smoke
          test "$(docker inspect smoke --format '{{.State.ExitCode}}')" = 0
      - name: Keep a brain on a volume across a restart
        run: |
          wait_for_health() {
            for attempt in $(seq 1 30); do
              curl --silent --fail http://127.0.0.1:8080/health > /dev/null && return 0
              sleep 1
            done
            return 1
          }
          start_server() {
            docker run --detach --name "$1" --publish 8080:8080 --env API_KEYS --volume brains:/data auto-brain:ci
            wait_for_health
          }
          stop_server() {
            docker stop "$1"
            test "$(docker inspect "$1" --format '{{.State.ExitCode}}')" = 0
          }
          read_brain() {
            curl --silent --fail --header "authorization: Bearer $key" http://127.0.0.1:8080/v1/orgs/demo/brains/smoke
          }
          issued="$(docker run --rm auto-brain:ci node packages/identity/src/key-command.ts --org demo)"
          key="$(printf '%s\n' "$issued" | sed --quiet 's/^API key, shown only this once: //p')"
          echo "::add-mask::$key"
          API_KEYS="[$(printf '%s\n' "$issued" | sed --quiet 's/^API_KEYS entry: //p')]"
          export API_KEYS
          docker volume create brains
          start_server first
          test "$(curl --silent --output created.json --write-out '%{http_code}' \
            --header "authorization: Bearer $key" --header 'content-type: application/json' \
            --data '{"brain":"smoke","name":"Smoke test"}' http://127.0.0.1:8080/v1/orgs/demo/brains)" = 201
          read_brain > before-restart.json
          grep --quiet '"id":"smoke"' before-restart.json
          cmp created.json before-restart.json
          stop_server first
          start_server second
          read_brain > after-restart.json
          cmp before-restart.json after-restart.json
          stop_server second

  pull-request-title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The squash commit title must be a conventional commit
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint
        env:
          TITLE: ${{ github.event.pull_request.title }}

  workflows:
    name: Workflow security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  ci-ok:
    name: ci-ok
    if: always()
    needs: [verify, container, pull-request-title, workflows]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Every required job succeeded or was skipped
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
