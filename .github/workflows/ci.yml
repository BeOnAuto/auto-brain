name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgresql:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_PASSWORD: ledger-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format, lint, type-check, test with 100% coverage, knip, sherif
        run: pnpm check:ci
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
          LEDGER_TEST_POSTGRESQL_URL: postgresql://postgres:ledger-ci@127.0.0.1:5432/postgres

  container:
    name: Container (linux/${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/server/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          load: true
          tags: auto-brain:ci
      - name: Smoke test the image
        run: |
          docker run --detach --name smoke --publish 8080:8080 auto-brain:ci
          for attempt in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:8080/health && break
            sleep 1
          done
          test "$(curl --silent --fail http://127.0.0.1:8080/health)" = '{"status":"ok"}'
          test "$(docker exec smoke id -un)" = node
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/v1/orgs/demo/brains)" = 401
          test "$(curl --silent --include http://127.0.0.1:8080/v1/orgs/demo/brains | grep --ignore-case --count '^www-authenticate: Bearer')" = 1
          test "$(docker run --rm auto-brain:ci node packages/identity/src/key-command.ts --org demo | grep --count --extended-regexp '^API key, shown only this once: abk_[0-9a-f]{8}_[A-Za-z0-9_-]{43}$')" = 1
          docker stop smoke
          test "$(docker inspect smoke --format '{{.State.ExitCode}}')" = 0
      - name: Keep a brain on a volume across a restart
        run: |
          wait_for_health() {
            for attempt in $(seq 1 30); do
              curl --silent --fail http://127.0.0.1:8080/health > /dev/null && return 0
              sleep 1
            done
            return 1
          }
          start_server() {
            docker run --detach --name "$1" --publish 8080:8080 --env API_KEYS --volume brains:/data auto-brain:ci
            wait_for_health
          }
          stop_server() {
            docker stop "$1"
            test "$(docker inspect "$1" --format '{{.State.ExitCode}}')" = 0
          }
          read_brain() {
            curl --silent --fail --header "authorization: Bearer $key" http://127.0.0.1:8080/v1/orgs/demo/brains/smoke
          }
          issued="$(docker run --rm auto-brain:ci node packages/identity/src/key-command.ts --org demo)"
          key="$(printf '%s\n' "$issued" | sed --quiet 's/^API key, shown only this once: //p')"
          echo "::add-mask::$key"
          API_KEYS="[$(printf '%s\n' "$issued" | sed --quiet 's/^API_KEYS entry: //p')]"
          export API_KEYS
          docker volume create brains
          start_server first
          test "$(curl --silent --output created.json --write-out '%{http_code}' \
            --header "authorization: Bearer $key" --header 'content-type: application/json' \
            --data '{"brain":"smoke","name":"Smoke test"}' http://127.0.0.1:8080/v1/orgs/demo/brains)" = 201
          read_brain > before-restart.json
          grep --quiet '"id":"smoke"' before-restart.json
          cmp created.json before-restart.json
          stop_server first
          start_server second
          read_brain > after-restart.json
          cmp before-restart.json after-restart.json
          stop_server second
      - name: Keep a brain in PostgreSQL across a restart
        timeout-minutes: 2
        run: |
          issued="$(docker run --rm auto-brain:ci node packages/identity/src/key-command.ts --org demo)"
          key="$(printf '%s\n' "$issued" | sed --quiet 's/^API key, shown only this once: //p')"
          echo "::add-mask::$key"
          API_KEYS="[$(printf '%s\n' "$issued" | sed --quiet 's/^API_KEYS entry: //p')]"
          password=ledger-smoke
          DATABASE_URL="postgresql://postgres:$password@postgresql:5432/postgres"
          export API_KEYS DATABASE_URL
          ledger_line='"message":"The ledger is kept in PostgreSQL, in the database postgres on postgresql:5432"'
          docker network create ledger
          docker run --detach --name postgresql --network ledger --env POSTGRES_PASSWORD="$password" \
            postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
          for attempt in $(seq 1 30); do
            docker exec postgresql pg_isready --host 127.0.0.1 --username postgres --quiet && break
            sleep 1
          done
          wait_for_health() {
            for attempt in $(seq 1 30); do
              curl --silent --fail --max-time 5 http://127.0.0.1:8080/health > /dev/null && return 0
              sleep 1
            done
            return 1
          }
          read_brain() {
            curl --silent --fail --max-time 10 --header "authorization: Bearer $key" \
              http://127.0.0.1:8080/v1/orgs/demo/brains/smoke
          }
          docker run --detach --name ledger --network ledger --publish 8080:8080 --env API_KEYS --env DATABASE_URL \
            auto-brain:ci
          wait_for_health
          test "$(curl --silent --max-time 10 --output created.json --write-out '%{http_code}' \
            --header "authorization: Bearer $key" --header 'content-type: application/json' \
            --data '{"brain":"smoke","name":"Smoke test"}' http://127.0.0.1:8080/v1/orgs/demo/brains)" = 201
          read_brain > before-restart.json
          cmp created.json before-restart.json
          docker stop ledger
          test "$(docker inspect ledger --format '{{.State.ExitCode}}')" = 0
          docker start ledger
          wait_for_health
          read_brain > after-restart.json
          cmp before-restart.json after-restart.json
          docker stop ledger
          test "$(docker inspect ledger --format '{{.State.ExitCode}}')" = 0
          test "$(docker logs ledger 2>&1 | grep --count --fixed-strings "$ledger_line")" = 2
          test "$(docker logs ledger 2>&1 | grep --count --fixed-strings "$password")" = 0
          docker stop postgresql
      - name: Serve the tools over MCP
        run: |
          issued="$(docker run --rm auto-brain:ci node packages/identity/src/key-command.ts --org demo)"
          key="$(printf '%s\n' "$issued" | sed --quiet 's/^API key, shown only this once: //p')"
          echo "::add-mask::$key"
          reading="$(docker run --rm auto-brain:ci node packages/identity/src/key-command.ts --org demo --permissions org:read,brain:read)"
          read_key="$(printf '%s\n' "$reading" | sed --quiet 's/^API key, shown only this once: //p')"
          echo "::add-mask::$read_key"
          API_KEYS="[$(printf '%s\n' "$issued" | sed --quiet 's/^API_KEYS entry: //p'),$(printf '%s\n' "$reading" | sed --quiet 's/^API_KEYS entry: //p')]"
          export API_KEYS
          docker run --detach --name mcp --publish 8080:8080 --env API_KEYS auto-brain:ci
          for attempt in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:8080/health > /dev/null && break
            sleep 1
          done
          call_mcp_as() {
            curl --silent --fail --header "authorization: Bearer $1" \
              --header 'content-type: application/json' --header 'accept: application/json, text/event-stream' \
              --header 'mcp-protocol-version: 2025-11-25' --data "$3" "http://127.0.0.1:8080$2"
          }
          call_mcp() {
            call_mcp_as "$key" "$1" "$2"
          }
          call_mcp /orgs/demo/mcp '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' > tools.txt
          for tool in create_brain list_brains get_brain update_brain retire_brain; do
            grep --quiet "\"name\":\"$tool\"" tools.txt
          done
          call_mcp /orgs/demo/mcp '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"create_brain","arguments":{"brain":"smoke","name":"Smoke test"}}}' > created.txt
          grep --quiet '"structuredContent":{"id":"smoke","name":"Smoke test"' created.txt
          call_mcp /orgs/demo/mcp '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"get_brain","arguments":{"brain":"smoke"}}}' > read.txt
          grep --quiet '"structuredContent":{"id":"smoke","name":"Smoke test"' read.txt
          call_mcp /mcp '{"jsonrpc":"2.0","id":4,"method":"tools/list"}' > all-tools.txt
          test "$(grep --only-matching '"name":"[a-z_]*","title"' all-tools.txt | wc -l)" -eq 26
          for tool in list_models list_runs get_run_history get_event get_brain_analytics list_brain_events publish_event list_tool_servers test_tool_call list_interactions answer_interaction send_run_event cancel_run get_guide; do
            grep --quiet "\"name\":\"$tool\"" all-tools.txt
          done
          call_mcp /mcp '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"list_definitions","arguments":{"brain":"smoke","type":"reasoning"}}}' > definitions.txt
          grep --quiet '"structuredContent":{"definitions":\[\]}' definitions.txt
          call_mcp /mcp '{"jsonrpc":"2.0","id":6,"method":"tools/call","params":{"name":"list_runs","arguments":{"brain":"smoke"}}}' > runs.txt
          grep --quiet '"structuredContent":{"runs":\[\],"has_more":false,"next_cursor":null}' runs.txt
          call_mcp /mcp '{"jsonrpc":"2.0","id":7,"method":"tools/call","params":{"name":"list_tool_servers","arguments":{"brain":"smoke"}}}' > tool-servers.txt
          grep --quiet '"structuredContent":{"tool_servers":\[\]}' tool-servers.txt
          call_mcp /mcp '{"jsonrpc":"2.0","id":15,"method":"tools/call","params":{"name":"list_tool_servers","arguments":{}}}' > org-tool-servers.txt
          grep --quiet '"structuredContent":{"tool_servers":\[\]}' org-tool-servers.txt
          test "$(curl --silent --fail --header "authorization: Bearer $read_key" http://127.0.0.1:8080/v1/orgs/demo/tool-servers)" = '{"tool_servers":[]}'
          call_mcp /mcp '{"jsonrpc":"2.0","id":13,"method":"tools/call","params":{"name":"test_tool_call","arguments":{"brain":"smoke","server":"graph","tool":"search"}}}' > tested.txt
          grep --quiet '"isError":true' tested.txt
          grep --quiet 'mcp_server_not_configured' tested.txt
          call_mcp_as "$read_key" /mcp '{"jsonrpc":"2.0","id":14,"method":"tools/list"}' > read-tools.txt
          grep --quiet '"name":"list_tool_servers"' read-tools.txt
          test "$(grep --count '"name":"test_tool_call"' read-tools.txt)" = 0
          test "$(curl --silent --output refused.json --write-out '%{http_code}' \
            --header "authorization: Bearer $read_key" --header 'content-type: application/json' --data '{"arguments":{}}' \
            http://127.0.0.1:8080/v1/orgs/demo/brains/smoke/tool-servers/graph/tools/search/test)" = 403
          grep --quiet '"reason":"forbidden"' refused.json
          call_mcp /mcp '{"jsonrpc":"2.0","id":8,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' > initialized.txt
          grep --quiet 'Before writing a definition, read its format with get_guide' initialized.txt
          call_mcp /mcp '{"jsonrpc":"2.0","id":9,"method":"tools/call","params":{"name":"get_guide","arguments":{"guide":"reasoning-function"}}}' > guide.txt
          grep --quiet '# Reasoning function format' guide.txt
          grep --quiet 'On this server, ' guide.txt
          call_mcp /mcp '{"jsonrpc":"2.0","id":10,"method":"resources/list"}' > resources.txt
          test "$(grep --only-matching '"uri":"guide://[a-z-]*"' resources.txt | wc -l)" -eq 10
          call_mcp /mcp '{"jsonrpc":"2.0","id":11,"method":"prompts/list"}' > prompts.txt
          for prompt in first-brain remember give-tools schedule; do
            grep --quiet "\"name\":\"$prompt\"" prompts.txt
          done
          call_mcp /mcp '{"jsonrpc":"2.0","id":12,"method":"prompts/get","params":{"name":"first-brain"}}' > first-brain.txt
          grep --quiet 'Create my first brain.' first-brain.txt
          docker stop mcp
          test "$(docker inspect mcp --format '{{.State.ExitCode}}')" = 0
      - name: Run a reasoning function without model settings
        run: |
          issued="$(docker run --rm auto-brain:ci node packages/identity/src/key-command.ts --org demo)"
          key="$(printf '%s\n' "$issued" | sed --quiet 's/^API key, shown only this once: //p')"
          echo "::add-mask::$key"
          API_KEYS="[$(printf '%s\n' "$issued" | sed --quiet 's/^API_KEYS entry: //p')]"
          export API_KEYS
          docker run --detach --name reasoning --publish 8080:8080 --env API_KEYS auto-brain:ci
          for attempt in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:8080/health > /dev/null && break
            sleep 1
          done
          call() {
            curl --silent --output "$1" --write-out '%{http_code}' \
              --header "authorization: Bearer $key" --header 'content-type: application/json' "${@:2}"
          }
          brain=http://127.0.0.1:8080/v1/orgs/demo/brains/smoke
          source="$(printf '%s\n' '---' 'model: anthropic/claude-sonnet-4-5' '---' 'Say hello to {{ input.name }}.')"
          definition="$(jq --null-input --arg source "$source" '{name: "hello", source: $source}')"
          test "$(call brain.json --data '{"brain":"smoke","name":"Smoke test"}' http://127.0.0.1:8080/v1/orgs/demo/brains)" = 201
          test "$(call created.json --data "$definition" "$brain/definitions/reasoning")" = 201
          test "$(call read.json "$brain/definitions/reasoning/hello")" = 200
          test "$(jq --raw-output .source read.json)" = "$source"
          test "$(call ran.json --data '{"input":{"name":"CI"}}' "$brain/definitions/reasoning/hello/run")" = 503
          test "$(jq --raw-output .reason ran.json)" = unavailable
          test "$(jq --raw-output .detail ran.json)" = \
            'anthropic is not configured. No model provider is configured'
          docker stop reasoning
          test "$(docker inspect reasoning --format '{{.State.ExitCode}}')" = 0
      - name: Run a computation function
        run: |
          issued="$(docker run --rm auto-brain:ci node packages/identity/src/key-command.ts --org demo)"
          key="$(printf '%s\n' "$issued" | sed --quiet 's/^API key, shown only this once: //p')"
          echo "::add-mask::$key"
          API_KEYS="[$(printf '%s\n' "$issued" | sed --quiet 's/^API_KEYS entry: //p')]"
          export API_KEYS
          docker run --detach --name computation --publish 8080:8080 --env API_KEYS auto-brain:ci
          for attempt in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:8080/health > /dev/null && break
            sleep 1
          done
          call() {
            curl --silent --max-time 30 --output "$1" --write-out '%{http_code}' \
              --header "authorization: Bearer $key" --header 'content-type: application/json' "${@:2}"
          }
          brain=http://127.0.0.1:8080/v1/orgs/demo/brains/smoke
          total="$(printf '%s\n' '---' 'language: typescript' 'input:' '  schema: {type: object, required: [rows]}' '---' \
            'export default function (input: any): Output {' \
            '  const total_cents = input.rows.reduce((sum: number, row: any) => sum + row.cost_cents, 0);' \
            '  return { total_cents, rows: input.rows.length };' '}')"
          raising="$(printf '%s\n' '---' 'language: typescript' '---' 'export default function (input: Input): Output {' \
            "  throw new Error('no rows');" '}')"
          test "$(call brain.json --data '{"brain":"smoke","name":"Smoke test"}' http://127.0.0.1:8080/v1/orgs/demo/brains)" = 201
          for name in total raising; do
            definition="$(jq --null-input --arg name "$name" --arg source "${!name}" '{name: $name, source: $source}')"
            test "$(call created.json --data "$definition" "$brain/definitions/computation")" = 201
          done
          test "$(call totalled.json --data '{"input":{"rows":[{"cost_cents":1050},{"cost_cents":2075}]}}' \
            "$brain/definitions/computation/total/run")" = 200
          test "$(jq --compact-output '[.status, .output]' totalled.json)" = '["succeeded",{"total_cents":3125,"rows":2}]'
          test "$(call raised.json --data '{"input":{}}' "$brain/definitions/computation/raising/run")" = 409
          test "$(jq --compact-output '[.reason, .kind, .detail]' raised.json)" = \
            '["conflict","unworkable","The program raised an error on line 5: Error: no rows"]'
          docker stop computation
          test "$(docker inspect computation --format '{{.State.ExitCode}}')" = 0
      - name: Ask through the inbox and answer over HTTP
        timeout-minutes: 2
        run: |
          issued="$(docker run --rm auto-brain:ci node packages/identity/src/key-command.ts --org demo)"
          key="$(printf '%s\n' "$issued" | sed --quiet 's/^API key, shown only this once: //p')"
          echo "::add-mask::$key"
          API_KEYS="[$(printf '%s\n' "$issued" | sed --quiet 's/^API_KEYS entry: //p')]"
          export API_KEYS
          docker run --detach --name interaction --publish 8080:8080 --env API_KEYS auto-brain:ci
          for attempt in $(seq 1 30); do
            curl --silent --fail --max-time 5 http://127.0.0.1:8080/health > /dev/null && break
            sleep 1
          done
          call() {
            curl --silent --max-time 30 --output "$1" --write-out '%{http_code}' \
              --header "authorization: Bearer $key" --header 'content-type: application/json' "${@:2}"
          }
          brain=http://127.0.0.1:8080/v1/orgs/demo/brains/smoke
          source="$(printf '%s\n' '---' "to: '{{ input.owner }}'" 'expires: P1D' 'output:' \
            '  schema: {type: object, required: [choice], properties: {choice: {type: string, enum: [approve, reject]}}}' \
            '---' 'Approve the brief for {{ input.campaign }}?')"
          definition="$(jq --null-input --arg source "$source" '{name: "approve-brief", source: $source}')"
          test "$(call brain.json --data '{"brain":"smoke","name":"Smoke test"}' http://127.0.0.1:8080/v1/orgs/demo/brains)" = 201
          test "$(call created.json --data "$definition" "$brain/definitions/interaction")" = 201
          test "$(call asked.json --data '{"input":{"owner":"ada","campaign":"Spring"}}' \
            "$brain/definitions/interaction/approve-brief/run")" = 200
          test "$(jq --raw-output .status asked.json)" = started
          asked="$(jq --raw-output .run_id asked.json)"
          test "$(call inbox.json "$brain/interactions?to=ada")" = 200
          test "$(jq --compact-output '[.interactions[] | [.run_id, .message]]' inbox.json)" = \
            "[[\"$asked\",\"Approve the brief for Spring?\"]]"
          test "$(call answered.json --data '{"answer":{"choice":"approve"}}' "$brain/runs/$asked/answer")" = 200
          test "$(call run.json "$brain/runs/$asked")" = 200
          test "$(jq --compact-output '[.status, .output]' run.json)" = '["succeeded",{"choice":"approve"}]'
          test "$(call again.json --data '{"answer":{"choice":"reject"}}' "$brain/runs/$asked/answer")" = 409
          docker stop interaction
          test "$(docker inspect interaction --format '{{.State.ExitCode}}')" = 0
      - name: Run workflows across a restart, and read the steps of a run and their causes
        timeout-minutes: 5
        run: |
          issued="$(docker run --rm auto-brain:ci node packages/identity/src/key-command.ts --org demo)"
          key="$(printf '%s\n' "$issued" | sed --quiet 's/^API key, shown only this once: //p')"
          echo "::add-mask::$key"
          API_KEYS="[$(printf '%s\n' "$issued" | sed --quiet 's/^API_KEYS entry: //p')]"
          export API_KEYS
          wait_for_health() {
            for attempt in $(seq 1 30); do
              curl --silent --fail --max-time 5 http://127.0.0.1:8080/health > /dev/null && return 0
              sleep 1
            done
            return 1
          }
          start_server() {
            docker run --detach --name "$1" --publish 8080:8080 --env API_KEYS --volume workflows:/data auto-brain:ci
            wait_for_health
          }
          stop_server() {
            docker stop "$1"
            test "$(docker inspect "$1" --format '{{.State.ExitCode}}')" = 0
          }
          call() {
            curl --silent --max-time 30 --output "$1" --write-out '%{http_code}' \
              --header "authorization: Bearer $key" --header 'content-type: application/json' "${@:2}"
          }
          brain=http://127.0.0.1:8080/v1/orgs/demo/brains/smoke
          settled() {
            for attempt in $(seq 1 30); do
              test "$(call "$1" "$brain/runs/$2")" = 200
              test "$(jq --raw-output .status "$1")" != started && return 0
              sleep 1
            done
            return 1
          }
          greet="$(printf '%s\n' "document: { dsl: '1.0.3', namespace: smoke, name: greet, version: '1.0.0' }" 'do:' \
            "  - greet: { set: { greeting: '\${ \"Hello, \" + \$data.name }' } }")"
          approval="$(printf '%s\n' "document: { dsl: '1.0.3', namespace: smoke, name: approval, version: '1.0.0' }" 'do:' \
            '  - decide: { listen: { to: { one: { with: { type: com.example.approval.decided } } } } }')"
          docker volume create workflows
          start_server workflows-first
          test "$(docker logs workflows-first 2>&1 | grep --count '"message":"Workflows run in this server: ')" = 1
          test "$(call brain.json --data '{"brain":"smoke","name":"Smoke test"}' http://127.0.0.1:8080/v1/orgs/demo/brains)" = 201
          for name in greet approval; do
            definition="$(jq --null-input --arg name "$name" --arg source "${!name}" '{name: $name, source: $source}')"
            test "$(call created.json --data "$definition" "$brain/definitions/workflow")" = 201
          done
          test "$(call greeting.json --data '{"input":{"name":"CI"}}' "$brain/definitions/workflow/greet/run")" = 200
          settled greeted.json "$(jq --raw-output .run_id greeting.json)"
          test "$(jq --compact-output '[.status, .output]' greeted.json)" = '["succeeded",{"greeting":"Hello, CI"}]'
          test "$(call waiting.json --data '{}' "$brain/definitions/workflow/approval/run")" = 200
          waiting="$(jq --raw-output .run_id waiting.json)"
          stop_server workflows-first
          start_server workflows-second
          test "$(call sent.json --data '{"event":{"type":"com.example.approval.decided","data":{"approved":true}}}' \
            "$brain/runs/$waiting/events")" = 200
          settled approved.json "$waiting"
          test "$(jq --compact-output '[.status, .output]' approved.json)" = '["succeeded",[{"approved":true}]]'
          test "$(call history.json "$brain/runs/$waiting/history")" = 200
          jq --exit-status '(.events | INDEX(.id) as $by
            | [.[] | [.type, (if .type == "run_started" then .metadata.definition.name else .data.name // .data.input.kind end),
              $by[.metadata.causation_id // ""].type]] | sort) == [
              ["run_started", "approval", null], ["run_succeeded", null, "workflow_input_applied"],
              ["step_finished", "decide", "workflow_input_applied"], ["step_waiting", "decide", "workflow_input_applied"],
              ["workflow_input_applied", "event_received", "workflow_input_applied"],
              ["workflow_input_applied", "started", "run_started"]]' history.json
          stop_server workflows-second
      - name: Read the analytics of a brain
        timeout-minutes: 2
        run: |
          issued="$(docker run --rm auto-brain:ci node packages/identity/src/key-command.ts --org demo)"
          key="$(printf '%s\n' "$issued" | sed --quiet 's/^API key, shown only this once: //p')"
          echo "::add-mask::$key"
          API_KEYS="[$(printf '%s\n' "$issued" | sed --quiet 's/^API_KEYS entry: //p')]"
          export API_KEYS
          docker run --detach --name analytics --publish 8080:8080 --env API_KEYS --volume workflows:/data auto-brain:ci
          for attempt in $(seq 1 30); do
            curl --silent --fail --max-time 5 http://127.0.0.1:8080/health > /dev/null && break
            sleep 1
          done
          call() {
            curl --silent --max-time 30 --output "$1" --write-out '%{http_code}' \
              --header "authorization: Bearer $key" --header 'content-type: application/json' "${@:2}"
          }
          brain=http://127.0.0.1:8080/v1/orgs/demo/brains/smoke
          source="$(printf '%s\n' '---' 'model: anthropic/claude-sonnet-4-5' '---' 'Say hello to {{ input.name }}.')"
          definition="$(jq --null-input --arg source "$source" '{name: "hello", source: $source}')"
          test "$(call created.json --data "$definition" "$brain/definitions/reasoning")" = 201
          test "$(call ran.json --data '{"input":{"name":"CI"}}' "$brain/definitions/reasoning/hello/run")" = 503
          test "$(call analytics.json "$brain/analytics")" = 200
          test "$(jq --compact-output '[.days, .runs.succeeded, .runs.rejected, .by_day[-1].day, .by_day[-1].runs.total]' \
            analytics.json)" = "[7,2,1,\"$(date --utc +%F)\",3]"
          test "$(jq --compact-output '[.by_function[] | [.type, .name, .runs]]' analytics.json)" = \
            '[["reasoning","hello",1],["workflow","approval",1],["workflow","greet",1]]'
          docker stop analytics
          test "$(docker inspect analytics --format '{{.State.ExitCode}}')" = 0
      - name: Recall what the smoke workflows answered
        timeout-minutes: 2
        run: |
          issued="$(docker run --rm auto-brain:ci node packages/identity/src/key-command.ts --org demo)"
          key="$(printf '%s\n' "$issued" | sed --quiet 's/^API key, shown only this once: //p')"
          echo "::add-mask::$key"
          API_KEYS="[$(printf '%s\n' "$issued" | sed --quiet 's/^API_KEYS entry: //p')]"
          export API_KEYS
          docker run --detach --name recall --publish 8080:8080 --env API_KEYS --volume workflows:/data auto-brain:ci
          for attempt in $(seq 1 30); do
            curl --silent --fail --max-time 5 http://127.0.0.1:8080/health > /dev/null && break
            sleep 1
          done
          call() {
            curl --silent --max-time 30 --output "$1" --write-out '%{http_code}' \
              --header "authorization: Bearer $key" --header 'content-type: application/json' "${@:2}"
          }
          brain=http://127.0.0.1:8080/v1/orgs/demo/brains/smoke
          source="$(printf '%s\n' '---' 'language: typescript' 'source:' '  events:' '    - type: run_succeeded' \
            '      subject: workflow/greet' 'view:' '  initial: []' '---' 'export function fold(view: any, event: any): any {' \
            '  return [...view, event.data.output?.greeting ?? "none"];' '}')"
          definition="$(jq --null-input --arg source "$source" '{name: "greetings", source: $source}')"
          test "$(call created.json --data "$definition" "$brain/definitions/recall")" = 201
          for attempt in $(seq 1 30); do
            test "$(call standing.json "$brain/definitions/recall/greetings")" = 200
            test "$(jq --compact-output '[.standing.state, .standing.folded]' standing.json)" = '["live",1]' && break
            sleep 1
          done
          test "$(jq --compact-output '[.standing.state, .standing.folded]' standing.json)" = '["live",1]'
          test "$(call recalled.json --data '{}' "$brain/definitions/recall/greetings/run")" = 200
          test "$(jq --compact-output '[.status, .output]' recalled.json)" = '["succeeded",["Hello, CI"]]'
          test "$(call run.json "$brain/runs/$(jq --raw-output .run_id recalled.json)")" = 200
          test "$(jq --compact-output '[.record.view.version, .record.view.folded]' run.json)" = '[1,1]'
          docker stop recall
          test "$(docker inspect recall --format '{{.State.ExitCode}}')" = 0

      - name: Start a workflow by its event trigger and by its schedule
        timeout-minutes: 5
        run: |
          issued="$(docker run --rm auto-brain:ci node packages/identity/src/key-command.ts --org demo)"
          key="$(printf '%s\n' "$issued" | sed --quiet 's/^API key, shown only this once: //p')"
          echo "::add-mask::$key"
          API_KEYS="[$(printf '%s\n' "$issued" | sed --quiet 's/^API_KEYS entry: //p')]"
          export API_KEYS
          docker run --detach --name reactions --publish 8080:8080 --env API_KEYS auto-brain:ci
          for attempt in $(seq 1 30); do
            curl --silent --fail --max-time 5 http://127.0.0.1:8080/health > /dev/null && break
            sleep 1
          done
          call() {
            curl --silent --max-time 30 --output "$1" --write-out '%{http_code}' \
              --header "authorization: Bearer $key" --header 'content-type: application/json' "${@:2}"
          }
          brain=http://127.0.0.1:8080/v1/orgs/demo/brains/smoke
          ended_runs() {
            for attempt in $(seq 1 "$3"); do
              test "$(call runs.json "$brain/runs?type=workflow&name=$1")" = 200
              jq --exit-status --argjson count "$2" '[.runs[] | select(.status != "started")] | length >= $count' \
                runs.json > /dev/null && return 0
              sleep 1
            done
            return 1
          }
          closing="$(printf '%s\n' "document: { dsl: '1.0.3', namespace: smoke, name: closing, version: '1.0.0' }" \
            'schedule: { on: { one: { with: { type: com.example.ledger.closed } } }, every: PT1M }' 'do:' \
            "  - total: { set: { input: '\${ \$data }' } }")"
          test "$(call brain.json --data '{"brain":"smoke","name":"Smoke test"}' http://127.0.0.1:8080/v1/orgs/demo/brains)" = 201
          definition="$(jq --null-input --arg source "$closing" '{name: "closing", source: $source}')"
          test "$(call created.json --data "$definition" "$brain/definitions/workflow")" = 201
          test "$(jq --compact-output '[.triggers[] | [.kind, .reference]]' created.json)" = \
            '[["event","/schedule/on"],["every","/schedule/every"]]'
          test "$(call published.json \
            --data '{"event":{"source":"/ledger","type":"com.example.ledger.closed","data":{"month":"september"}}}' \
            "$brain/events")" = 200
          ended_runs closing 2 150
          test "$(jq --compact-output '[.runs[] | [.status, .started_by]]' runs.json)" = \
            '[["succeeded","brain:smoke"],["succeeded","brain:smoke"]]'
          for run in $(jq --raw-output '.runs[].run_id' runs.json); do
            test "$(call "history-$run.json" "$brain/runs/$run/history")" = 200
            test "$(call "run-$run.json" "$brain/runs/$run")" = 200
            case "$(jq --raw-output '.events[0].metadata.trigger.kind' "history-$run.json")" in
              event) test "$(jq --raw-output '.output.input[0].data.month' "run-$run.json")" = september ;;
              every) jq --exit-status '.output.input.schedule.due | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T")' \
                "run-$run.json" > /dev/null ;;
            esac
          done
          test "$(jq --slurp --compact-output 'map(.events[0] | [.metadata.trigger.kind, .summary]) | sort' history-*.json)" = \
            '[["event","A run of the workflow “closing” was started by its event trigger."],["every","A run of the workflow “closing” was started by its every schedule."]]'
          docker stop reactions
          test "$(docker inspect reactions --format '{{.State.ExitCode}}')" = 0

  pull-request-title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The squash commit title must be a conventional commit
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint
        env:
          TITLE: ${{ github.event.pull_request.title }}

  workflows:
    name: Workflow security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  ci-ok:
    name: ci-ok
    if: always()
    needs: [verify, container, pull-request-title, workflows]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Every required job succeeded or was skipped
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
